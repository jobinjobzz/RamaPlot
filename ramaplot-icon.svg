<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d6be4"/>
      <stop offset="100%" stop-color="#1a9b8a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="c"><rect width="120" height="120" rx="26"/></clipPath>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#g)"/>
  <!-- Shine -->
  <rect width="120" height="60" rx="26" fill="url(#shine)" clip-path="url(#c)"/>
  <!-- Plot panel -->
  <rect x="14" y="16" width="92" height="88" rx="6" fill="rgba(0,0,0,0.18)"/>
  <!-- Axes -->
  <line x1="24" y1="94" x2="97" y2="94" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="94" x2="24" y2="24" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="97,91 100,94 97,97" fill="rgba(255,255,255,0.5)"/>
  <polygon points="21,24 24,21 27,24" fill="rgba(255,255,255,0.5)"/>
  <!-- Region halos -->
  <ellipse cx="42" cy="52" rx="11" ry="13" fill="rgba(255,255,255,0.12)"/>
  <ellipse cx="40" cy="78" rx="9" ry="7" fill="rgba(255,255,255,0.10)"/>
  <!-- Alpha cluster - white squares -->
  <rect x="34" y="42" width="4" height="4" rx="0.8" fill="white" opacity="0.92"/>
  <rect x="40" y="37" width="4" height="4" rx="0.8" fill="white" opacity="0.92"/>
  <rect x="47" y="44" width="4" height="4" rx="0.8" fill="white" opacity="0.92"/>
  <rect x="36" y="50" width="4" height="4" rx="0.8" fill="white" opacity="0.90"/>
  <rect x="44" y="49" width="4" height="4" rx="0.8" fill="white" opacity="0.88"/>
  <rect x="50" y="40" width="4" height="4" rx="0.8" fill="white" opacity="0.85"/>
  <rect x="39" y="56" width="4" height="4" rx="0.8" fill="white" opacity="0.82"/>
  <!-- Beta cluster - white squares -->
  <rect x="33" y="72" width="4" height="4" rx="0.8" fill="white" opacity="0.88"/>
  <rect x="39" y="76" width="4" height="4" rx="0.8" fill="white" opacity="0.88"/>
  <rect x="45" y="73" width="4" height="4" rx="0.8" fill="white" opacity="0.85"/>
  <rect x="36" y="80" width="4" height="4" rx="0.8" fill="white" opacity="0.82"/>
  <rect x="43" y="81" width="4" height="4" rx="0.8" fill="white" opacity="0.78"/>
  <!-- Glycine crosses -->
  <line x1="64" y1="46" x2="68" y2="50" stroke="rgba(255,255,255,0.6)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="68" y1="46" x2="64" y2="50" stroke="rgba(255,255,255,0.6)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Outlier dots - amber -->
  <rect x="75" y="30" width="5" height="5" rx="1" fill="#fbbf24"/>
  <rect x="83" y="55" width="4.5" height="4.5" rx="0.8" fill="#fbbf24" opacity="0.85"/>
  <rect x="68" y="82" width="4" height="4" rx="0.8" fill="#fbbf24" opacity="0.75"/>
  <!-- Axis labels -->
  <text x="100" y="98" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="rgba(255,255,255,0.65)">φ</text>
  <text x="16" y="22" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="rgba(255,255,255,0.65)">ψ</text>
</svg>
